name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write        # needed to replace the APK on the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap copy android && npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: safeguard-webapp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Keeps a ready-to-install APK sitting on the repo's Releases page at all times,
      # instead of only inside an Actions artifact (which expires and needs a GitHub login).
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" safeguard-webapp.apk

          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          SIZE=$(du -h safeguard-webapp.apk | cut -f1)

          {
            printf 'Debug build, %s — commit `%s`, built %s\n\n' "$SIZE" "$SHORT_SHA" "$BUILT"
            printf 'UI prototype only — no live backend wired up yet. Replaced automatically on every push to `main`.\n'
          } > release-notes.md

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "SafeGuard Webapp (latest build)" --notes-file release-notes.md
          else
            gh release create latest --title "SafeGuard Webapp (latest build)" --notes-file release-notes.md
          fi

          gh release upload latest safeguard-webapp.apk --clobber
